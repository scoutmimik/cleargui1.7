name: ClearPause

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle Wrapper Manually
        run: |
          curl -sLO https://services.gradle.org/distributions/gradle-2.7-bin.zip
          unzip -q gradle-2.7-bin.zip
          ./gradle-2.7/bin/gradle wrapper --gradle-version 2.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Inject local Minecraft client JAR and metadata
        run: |
          MC_DIR="$HOME/.gradle/caches/minecraft/net/minecraft/minecraft/1.7.10"
          mkdir -p "$MC_DIR"
          cp libs/1.7.10.jar "$MC_DIR/1.7.10.jar"
          echo '{"id":"1.7.10","time":"2014-06-25T11:00:00+02:00","releaseTime":"2014-06-25T11:00:00+02:00","type":"release"}' > "$MC_DIR/1.7.10.json"

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearPause-JAR
          path: 'build/libs/*.jar'
          if-no-files-found: error
