name: ClearPauseMOD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Download Forge 1.7.10 JAR
        run: |
          mkdir -p libs
          curl -L "https://maven.cleanroommc.com/com/cleanroommc/forge/1.7.10-1614-MCP/forge-1.7.10-1614-MCP.jar" -o libs/forge-dev.jar
      
      - name: Build with Maven
        run: mvn clean package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearPause-1.7.10-JAR
          path: 'target/*.jar'
          if-no-files-found: error
