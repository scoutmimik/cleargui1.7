name: ClearPause

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install Gradle 2.7 manually
        run: |
          wget https://services.gradle.org/distributions/gradle-2.7-bin.zip
          unzip gradle-2.7-bin.zip
          echo "$PWD/gradle-2.7/bin" >> $GITHUB_PATH

      - name: Setup Gradle Wrapper
        run: gradle wrapper --gradle-version 2.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Inject local Minecraft client JAR
        run: |
          mkdir -p ~/.gradle/caches/minecraft/net/minecraft/minecraft/1.7.10/
          cp libs/1.7.10.jar ~/.gradle/caches/minecraft/net/minecraft/minecraft/1.7.10/1.7.10.jar

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearPause-JAR
          path: 'build/libs/*.jar'
          if-no-files-found: error
