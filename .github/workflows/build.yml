name: ClearPauseMOD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Download Forge 1.7.10 JAR
        run: |
          mkdir -p libs
          wget -O libs/forge-dev.jar "https://github.com/CleanroomMC/Cleanroom/releases/download/0.2.0/forge-1.7.10-1614-1710-universal.jar" || \
          curl -L -o libs/forge-dev.jar "https://github.com/CleanroomMC/Cleanroom/releases/download/0.2.0/forge-1.7.10-1614-1710-universal.jar"

      - name: Build with Maven
        run: mvn clean package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearPause-1.7.10-JAR
          path: 'target/*.jar'
          if-no-files-found: error
