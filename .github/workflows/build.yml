name: ClearPauseMOD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Inject local Minecraft client JAR
        run: |
          mkdir -p ~/.gradle/caches/minecraft/net/minecraft/minecraft/1.7.10/
          cp libs/1.7.10.jar ~/.gradle/caches/minecraft/net/minecraft/minecraft/1.7.10/1.7.10.jar

      - name: Build with Gradle (Offline Mode)
        run: ./gradlew build --offline

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearPause-1.7.10-JAR
          path: 'build/libs/*.jar'
          if-no-files-found: error
