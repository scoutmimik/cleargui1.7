buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'

compileJava {
    sourceCompatibility = 1.8
    targetCompatibility = 1.8
    options.encoding = 'UTF-8'
}

version = "2.0"
group = "net.kohi"
archivesBaseName = "kokot"

minecraft {
    version = "1.7.10-10.13.4.1558-1.7.10"
    runDir = "eclipse"
    mappings = "stable_12"
}

tasks.whenTaskAdded { task ->
    if (task.name == 'downloadClient') {
        task.outputs.file(file("libs/1.7.10.jar"))
        task.doFirst {
            def mcDir = new File(System.getProperty("user.home"), ".gradle/caches/minecraft/net/minecraft/minecraft/1.7.10")
            mcDir.mkdirs()
            def targetJar = new File(mcDir, "1.7.10.jar")
            if (!targetJar.exists()) {
                ant.copy(file: file("libs/1.7.10.jar"), tofile: targetJar)
            }
        }
        task.enabled = false
    }
}

dependencies {
}

jar {
    manifest {
        attributes("TweakClass": "net.kohi.tcpnodelaymod.TcpNoDelayTweaker")
    }
}
