buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "GTNH Maven"
            url = "https://nexus.gtnewhorizons.com/repository/releases/"
        }
    }
    dependencies {
        classpath "com.gtnewhorizons:retrofuturagradle:1.4.1"
    }
}

apply plugin: 'com.gtnewhorizons.retrotaper'

version = "1.0.0"
group = "com.clearpause"
archivesBaseName = "ClearPause-1.7.10"

sourceCompatibility = targetCompatibility = "1.8"
compileJava.options.encoding = 'UTF-8'

minecraft {
    mcVersion = "1.7.10"
    username = "Developer"
    
    // Automaticky stiahne a opraví staré MCP mapovania
    useDepMap = false
}

repositories {
    mavenCentral()
}

dependencies {}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
        
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
